<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-label="CEREBRO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131C28"/><stop offset="100%" stop-color="#0A0F16"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#7E63E9"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="798" height="178" rx="14" fill="url(#bg)" stroke="#1E2A38" stroke-width="1.5"/>

  <!-- connectome: neurons (files) wired into one mind (the wiki) -->
  <g transform="translate(110,90)">
    <!-- synapse links, impulses travelling inward -->
    <g stroke="#5B4B9E" stroke-width="1.4" fill="none">
      <line x1="0" y1="0" x2="-46" y2="-30" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-54" y2="6"  stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.9s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-34" y2="40" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.5s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="44"  y2="-36" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.7s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="56"  y2="-4" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2.1s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="40"  y2="38" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="4"   y2="-52" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2.0s" repeatCount="indefinite"/></line>
    </g>
    <!-- neurons firing in sequence -->
    <g fill="#0A0F16" stroke="#A78BFA" stroke-width="2">
      <circle cx="-46" cy="-30" r="6"><animate attributeName="fill" values="#0A0F16;#A78BFA;#0A0F16" dur="2.4s" begin="0s"   repeatCount="indefinite"/></circle>
      <circle cx="-54" cy="6"   r="6"><animate attributeName="fill" values="#0A0F16;#A78BFA;#0A0F16" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="-34" cy="40"  r="6"><animate attributeName="fill" values="#0A0F16;#A78BFA;#0A0F16" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="44"  cy="-36" r="6"><animate attributeName="fill" values="#0A0F16;#A78BFA;#0A0F16" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="56"  cy="-4"  r="6"><animate attributeName="fill" values="#0A0F16;#A78BFA;#0A0F16" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="40"  cy="38"  r="6"><animate attributeName="fill" values="#0A0F16;#A78BFA;#0A0F16" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="4"   cy="-52" r="6"><animate attributeName="fill" values="#0A0F16;#A78BFA;#0A0F16" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- the mind: pulsing core -->
    <circle r="13" fill="url(#core)">
      <animate attributeName="r" values="13;16;13" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="13" fill="none" stroke="#C4B5FD" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="13;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="215" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="2" fill="#E7EDF3">CEREBRO</text>
  <text x="215" y="108" font-family="Menlo, Consolas, monospace" font-size="13" letter-spacing="1" fill="#8FA0B0">every file a neuron &#183; the wiki its connectome</text>
  <rect x="215" y="122" width="54" height="3" rx="1.5" fill="#7E63E9"/>
  <text x="776" y="34" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#7E63E9">OPEN SOURCE</text>
</svg>
