<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-label="REHOBOAM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131C28"/><stop offset="100%" stop-color="#0A0F16"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="178" rx="14" fill="url(#bg)" stroke="#1E2A38" stroke-width="1.5"/>
  <g transform="translate(110,90.0)">
    <g fill="none" stroke="#1D5B70" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round">
      <circle r="52"/>
      <ellipse rx="52" ry="20"/>
      <ellipse rx="20" ry="52"/>
    </g>
    <ellipse rx="60" ry="14" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      <circle cx="60" cy="0" r="4" fill="#67E8F9"/>
    </g>
    <circle r="6" fill="#0A0F16" stroke="#22D3EE" stroke-width="2">
      <animate attributeName="r" values="6;8;6" dur="2.4s" repeatCount="indefinite"/>
    </circle></g>
  <text x="215" y="78.0" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="2" fill="#E7EDF3">REHOBOAM</text>
  <text x="215" y="108.0" font-family="Menlo, Consolas, monospace" font-size="13" letter-spacing="1" fill="#8FA0B0">a visual claude code &#183; knowledge OS</text>
  <rect x="215" y="122.0" width="54" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="776" y="34" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#22D3EE">IN DEVELOPMENT</text>
</svg>
