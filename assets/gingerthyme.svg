<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Ginger Thyme — liquore allo zenzero e timo">
  <defs>
    <radialGradient id="gtbg" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#121608"/>
      <stop offset="100%" stop-color="#070903"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4F05A"/>
      <stop offset="100%" stop-color="#AFC72F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#gtbg)"/>

  <!-- ornamental corner filigree -->
  <g fill="none" stroke="#3A4526" stroke-width="1.4" stroke-linecap="round">
    <path d="M24 46 q 0 -22 22 -22 q -12 8 -6 16 q 6 8 14 2"/>
    <path d="M1176 174 q 0 22 -22 22 q 12 -8 6 -16 q -6 -8 -14 -2"/>
    <circle cx="52" cy="28" r="2"/>
    <circle cx="1148" cy="192" r="2"/>
  </g>

  <!-- ============ bottle ============ -->
  <g transform="translate(150,0)">
    <!-- cork -->
    <rect x="-11" y="18" width="22" height="16" rx="3" fill="#1A1D12" stroke="#5C6B3A" stroke-width="1.4"/>
    <!-- neck + body outline -->
    <path d="M-9 34 v 26 q 0 8 -14 16 q -9 6 -9 16 v 70 q 0 12 12 12 h 40 q 12 0 12 -12 v -70 q 0 -10 -9 -16 q -14 -8 -14 -16 v -26 Z"
          fill="none" stroke="#7C8A5A" stroke-width="2"/>
    <!-- liquid -->
    <path d="M-29 108 h 58 v 62 q 0 9 -9 9 h -40 q -9 0 -9 -9 Z" fill="#C8D948" opacity="0.22"/>
    <line x1="-29" y1="108" x2="29" y2="108" stroke="#C8D948" stroke-width="1.4" opacity="0.7">
      <animate attributeName="y1" values="108;105;108" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="108;111;108" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- bubbles -->
    <g fill="#D9E84A">
      <circle cx="-12" r="2.4" cy="168">
        <animate attributeName="cy" values="168;114" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="4" r="1.8" cy="172">
        <animate attributeName="cy" values="172;112" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" r="2.2" cy="165">
        <animate attributeName="cy" values="165;116" dur="3.8s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="3.8s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- mini label -->
    <rect x="-20" y="118" width="40" height="34" rx="4" fill="#0B0D07" stroke="#5C6B3A" stroke-width="1.2"/>
    <text x="0" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="1" fill="#D9E84A">GT</text>
  </g>

  <!-- ============ wordmark ============ -->
  <text x="600" y="72" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" letter-spacing="6" fill="#6F7D52">GIORGIO GRAMEGNA PRESENTS</text>
  <text x="600" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" letter-spacing="4" fill="url(#lime)">GINGER THYME</text>
  <text x="600" y="152" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#8FA07A">LIQUORE ALLO ZENZERO E TIMO &#183; DRY</text>
  <text x="600" y="186" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#B7C878">&#8220;it's always ginger thyme somewhere.&#8221;
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4.5s" repeatCount="indefinite"/>
  </text>

  <!-- ============ thyme clock (the pun, drawn) ============ -->
  <g transform="translate(1050,110)">
    <circle r="52" fill="none" stroke="#7C8A5A" stroke-width="2"/>
    <!-- ticks -->
    <g stroke="#5C6B3A" stroke-width="1.6" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-45"/>
      <line x1="52" y1="0" x2="45" y2="0"/>
      <line x1="0" y1="52" x2="0" y2="45"/>
      <line x1="-52" y1="0" x2="-45" y2="0"/>
      <line x1="36.8" y1="-36.8" x2="31.8" y2="-31.8"/>
      <line x1="36.8" y1="36.8" x2="31.8" y2="31.8"/>
      <line x1="-36.8" y1="36.8" x2="-31.8" y2="31.8"/>
      <line x1="-36.8" y1="-36.8" x2="-31.8" y2="-31.8"/>
    </g>
    <!-- hour hand: a thyme sprig -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#C8D948" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="-4" cy="-12" rx="4" ry="2" fill="#AFC72F" transform="rotate(-30 -4 -12)"/>
      <ellipse cx="4" cy="-17" rx="4" ry="2" fill="#AFC72F" transform="rotate(30 4 -17)"/>
      <ellipse cx="-4" cy="-22" rx="4" ry="2" fill="#AFC72F" transform="rotate(-30 -4 -22)"/>
      <ellipse cx="0" cy="-30" rx="2.6" ry="4" fill="#D9E84A"/>
    </g>
    <!-- minute hand: a slimmer sprig -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-42" stroke="#8FA07A" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="0" cy="-42" rx="2" ry="3.2" fill="#8FA07A"/>
    </g>
    <circle r="3.4" fill="#D9E84A"/>
  </g>
</svg>
