<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Giorgio Gramegna — from fire to signal">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#131C28"/>
      <stop offset="100%" stop-color="#0A0F16"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7C2D12"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#B9C4D0"/>
      <stop offset="45%" stop-color="#B9C4D0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#B9C4D0"/>
      <stop offset="100%" stop-color="#B9C4D0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-650 0; 650 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint dotted grid -->
  <g fill="#22303F" opacity="0.55">
    <g id="dotrow">
      <circle cx="40" cy="30" r="1.1"/><circle cx="120" cy="30" r="1.1"/><circle cx="200" cy="30" r="1.1"/><circle cx="280" cy="30" r="1.1"/><circle cx="360" cy="30" r="1.1"/><circle cx="440" cy="30" r="1.1"/><circle cx="520" cy="30" r="1.1"/><circle cx="600" cy="30" r="1.1"/><circle cx="680" cy="30" r="1.1"/><circle cx="760" cy="30" r="1.1"/><circle cx="840" cy="30" r="1.1"/><circle cx="920" cy="30" r="1.1"/><circle cx="1000" cy="30" r="1.1"/><circle cx="1080" cy="30" r="1.1"/><circle cx="1160" cy="30" r="1.1"/>
    </g>
    <use href="#dotrow" y="60"/>
    <use href="#dotrow" y="120"/>
    <use href="#dotrow" y="180"/>
    <use href="#dotrow" y="240"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="62" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" letter-spacing="6" fill="#7C8A99">THE WORLD'S FIRST CRYPTO CHEF</text>

  <!-- name -->
  <text x="600" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="5" fill="url(#shine)">GIORGIO GRAMEGNA</text>

  <!-- ============ signature line: fire -> knife -> signal ============ -->

  <!-- fire side -->
  <path d="M60 175 C 110 175, 125 158, 150 166 S 200 186, 235 173 S 290 158, 320 170 S 380 184, 415 171 S 480 162, 520 175" fill="none" stroke="url(#fire)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M60 175 C 110 175, 125 158, 150 166 S 200 186, 235 173 S 290 158, 320 170 S 380 184, 415 171 S 480 162, 520 175;M60 175 C 108 173, 128 186, 152 172 S 198 156, 233 170 S 292 186, 322 168 S 378 158, 413 174 S 482 184, 520 175;M60 175 C 110 175, 125 158, 150 166 S 200 186, 235 173 S 290 158, 320 170 S 380 184, 415 171 S 480 162, 520 175" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- flame licks -->
  <g fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <path d="M150 166 q 4 -14 -2 -24">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M235 173 q 6 -16 0 -30">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M320 170 q 4 -12 -3 -22">
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M415 171 q 5 -15 -1 -26">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- chef's knife (blade edge sits on the line) -->
  <g>
    <!-- handle -->
    <rect x="524" y="146" width="44" height="14" rx="7" fill="#3B2A1E" stroke="#5C4632" stroke-width="1"/>
    <circle cx="537" cy="153" r="1.6" fill="#8A6B4D"/>
    <circle cx="555" cy="153" r="1.6" fill="#8A6B4D"/>
    <!-- blade -->
    <path d="M568 143 L 688 155 Q 690 160, 684 166 L 576 175 Q 566 168, 568 143 Z" fill="url(#steel)"/>
    <!-- edge glint -->
    <line x1="580" y1="172" x2="680" y2="164" stroke="#F8FAFC" stroke-width="1" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- signal side: circuit trace -->
  <path d="M688 175 h 40 v -18 h 52 v 18 h 58 v 16 h 64 v -16 h 56 v -20 h 60 v 20 h 62 v 14 h 50"
        fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="10 7">
    <animate attributeName="stroke-dashoffset" from="0" to="-170" dur="4s" repeatCount="indefinite"/>
  </path>
  <!-- circuit nodes -->
  <g fill="#0A0F16" stroke="#22D3EE" stroke-width="2">
    <circle cx="780" cy="157" r="4.5"/>
    <circle cx="902" cy="191" r="4.5"/>
    <circle cx="1018" cy="155" r="4.5"/>
    <circle cx="1140" cy="189" r="4.5">
      <animate attributeName="stroke" values="#22D3EE;#67E8F9;#22D3EE" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>


  <circle r="4.5" fill="#A5F3FC">
    <animateMotion dur="4s" repeatCount="indefinite" path="M688 175 h 40 v -18 h 52 v 18 h 58 v 16 h 64 v -16 h 56 v -20 h 60 v 20 h 62 v 14 h 50"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.5;0.92;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- journey line -->
  <text x="600" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#9FB0C0">KITCHEN&#160;&#160;&#8594;&#160;&#160;WEB3&#160;&#160;&#8594;&#160;&#160;AI<tspan fill="#22D3EE" font-weight="bold">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- tagline -->
  <text x="600" y="266" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" letter-spacing="1" fill="#7C8A99">cook the code &#183; ship the dish</text>

  <!-- corner handle -->
  <text x="1156" y="288" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#3E4E5E">@itboy79</text>
</svg>
